name: windows-ci

on:
  pull_request:
  push:
    branches: [main, feature/cmake-bootstrap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ${{ matrix.preset == 'windows-arm64-release' && 'windows-11-vs2026-arm' || 'windows-2025-vs2026' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-x64-debug, windows-x64-release, windows-x64-asan, windows-x64-app-asan, windows-arm64-release]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap pinned external vcpkg
        if: matrix.preset != 'windows-x64-asan'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $registryBaseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $ciVcpkgRoot = Join-Path $env:RUNNER_TEMP 'civic89-vcpkg'
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git $ciVcpkgRoot
          git -C $ciVcpkgRoot checkout --detach $registryBaseline
          & (Join-Path $ciVcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$ciVcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- /m

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Bootstrap verified installer compiler
        if: matrix.preset == 'windows-x64-release' || matrix.preset == 'windows-arm64-release'
        run: |
          $compiler=./tools/release/Bootstrap-InnoSetup.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'civic89-inno-6.7.3')
          "INNO_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package and verify the complete development delivery
        if: matrix.preset == 'windows-x64-release' || matrix.preset == 'windows-arm64-release'
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          ./tools/release/Package-Release.ps1 -BuildDirectory "out/build/${{ matrix.preset }}" -Iscc $env:INNO_ISCC
          $delivery=@(Get-ChildItem out/releases -Directory -Filter 'civic89-*')
          if ($delivery.Count -ne 1) { throw 'Expected one complete release delivery.' }
          ./tools/release/Test-ReleaseTransactions.ps1 -DeliveryDirectory $delivery[0].FullName
          ./tools/release/Test-Installer.ps1 -DeliveryDirectory $delivery[0].FullName
          "CANDIDATE_DIRECTORY=$($delivery[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $arch=if ('${{ matrix.preset }}' -eq 'windows-arm64-release') { 'arm64' } else { 'x64' }
          "CANDIDATE_ARCH=$arch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload ZIP, installer, corresponding source and checksums
        if: matrix.preset == 'windows-x64-release' || matrix.preset == 'windows-arm64-release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ env.CANDIDATE_ARCH }}
          path: |
            ${{ env.CANDIDATE_DIRECTORY }}/*.zip
            ${{ env.CANDIDATE_DIRECTORY }}/*-setup.exe
            ${{ env.CANDIDATE_DIRECTORY }}/SHA256SUMS.txt
            ${{ env.CANDIDATE_DIRECTORY }}/delivery.json
          if-no-files-found: error
